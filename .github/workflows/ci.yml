name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Postgres dev (mesmo compose do local) — exigido pelos testes de integração da 002
      - run: docker compose -f infra/compose.dev.yml up -d --wait
      - run: pnpm test
      - run: pnpm build
