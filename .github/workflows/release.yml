# Build + push das imagens de produção (011). A VPS nunca builda — só pull.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagens:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # falha de uma imagem não cancela o build da outra
      matrix:
        include:
          - nome: server
            dockerfile: infra/docker/server.Dockerfile
          - nome: console
            dockerfile: infra/docker/console.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/seta-agente-${{ matrix.nome }}:latest
            ghcr.io/${{ github.repository_owner }}/seta-agente-${{ matrix.nome }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,scope=${{ matrix.nome }},mode=max
