# Build + push das imagens de produção (011). A VPS nunca builda — só pull.
# P-30: roda DEPOIS do workflow `ci` terminar com sucesso no main — push com
# teste quebrado não gera imagem. `workflow_dispatch` continua disponível para
# republicar um SHA à mão.
name: release
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagens:
    # só publica se o CI que disparou este run passou (ou se foi pedido à mão)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # o SHA do commit que o CI validou — não o HEAD do momento do build
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    strategy:
      fail-fast: false # falha de uma imagem não cancela o build da outra
      matrix:
        include:
          - nome: server
            dockerfile: infra/docker/server.Dockerfile
          - nome: console
            dockerfile: infra/docker/console.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/seta-agente-${{ matrix.nome }}:latest
            ghcr.io/${{ github.repository_owner }}/seta-agente-${{ matrix.nome }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,scope=${{ matrix.nome }},mode=max
