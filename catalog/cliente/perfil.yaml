id: cliente.perfil
version: 1
description: >-
  Dados cadastrais do cliente vinculado a esta conversa: razão social, nome
  fantasia e CNPJ (mascarado). Use quando o contato perguntar sobre o próprio
  cadastro ou quando precisar confirmar de qual empresa se trata. Não recebe
  parâmetros — o cliente é sempre o da sessão.
entities: [cliente]
modules: []
params:
  cliente_id:
    type: string
    source: session
    description: Cliente vinculado à sessão (nunca vem do modelo).
sql: >-
  SELECT id, documento, razao_social, nome_fantasia
  FROM v_cliente
  WHERE id = :cliente_id
limits:
  timeout_ms: 2000
  max_rows: 1
output:
  columns: [id, documento, razao_social, nome_fantasia]
  masking:
    documento: cnpj
tool:
  expose: true
  name: perfil_cliente
