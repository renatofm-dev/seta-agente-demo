id: vendas.ultimos_pedidos
version: 1
description: >-
  Pedidos mais recentes do cliente da sessão (exclui cancelados), do mais novo
  para o mais antigo: número, data de emissão, status do fluxo (recebido,
  faturado, em_separacao, em_transporte, entregue) e total em centavos. Use
  quando o contato perguntar "cadê meu pedido", "o que comprei", "meus últimos
  pedidos" sem citar um número específico.
entities: [pedido]
modules: [pedidos]
params:
  cliente_id:
    type: string
    source: session
    description: Cliente vinculado à sessão (nunca vem do modelo).
  quantidade:
    type: int
    source: agent
    required: false
    default: 5
    description: Quantos pedidos retornar (1 a 20; padrão 5).
sql: >-
  SELECT id, emissao, status, total_centavos
  FROM v_pedido
  WHERE cliente_id = :cliente_id AND status <> 'cancelado'
  ORDER BY emissao DESC
  LIMIT :quantidade
limits:
  timeout_ms: 3000
  max_rows: 20
output:
  columns: [id, emissao, status, total_centavos]
  masking: {}
tool:
  expose: true
  name: ultimos_pedidos
