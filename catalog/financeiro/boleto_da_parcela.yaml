id: financeiro.boleto_da_parcela
version: 1
description: >-
  Uma parcela específica do contrato da sessão, com a situação do boleto dela:
  número da parcela, total de parcelas, valor em centavos, vencimento, forma de
  pagamento e a linha digitável (nula quando não há boleto gerado). Entrada de
  VERIFICAÇÃO da 2ª via — o agente não a chama; quem chama é o servidor, antes
  de pedir o PDF ao ERP, para confirmar que a parcela é mesmo do contrato de
  quem está falando.
entities: [titulo]
modules: [financeiro]
params:
  contrato_id:
    type: string
    source: session
    description: Contrato vinculado à sessão (nunca vem do modelo).
  titulo_id:
    type: string
    source: agent
    description: >-
      Id da parcela, como veio de titulos_atraso ou proximas_parcelas. O bind
      de contrato é de SESSÃO — pedir a parcela de outro contrato não devolve
      linha nenhuma.
sql: >-
  SELECT id, parcela, total_parcelas, valor_centavos, vencimento,
         meio_pagamento, linha_digitavel, status
  FROM v_titulo
  WHERE contrato_id = :contrato_id AND id = :titulo_id
limits:
  timeout_ms: 3000
  max_rows: 1
output:
  columns:
    - id
    - parcela
    - total_parcelas
    - valor_centavos
    - vencimento
    - meio_pagamento
    - linha_digitavel
    - status
  masking: {}
tool:
  expose: false
  name: boleto_da_parcela
