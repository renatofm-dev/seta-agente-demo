id: financeiro.proxima_parcela
version: 2
description: >-
  Próxima parcela A VENCER do contrato da sessão: valor em centavos, data de
  vencimento, meio de pagamento (boleto|pix|cartao_recorrente) e, quando
  houver, linha digitável do boleto e código PIX copia-e-cola. Use quando o
  cotista perguntar quando vence a próxima parcela, quanto vai pagar ou pedir
  a segunda via/código de pagamento. Parcelas já vencidas ficam na tool de
  atraso.
  Ao falar de dinheiro, COPIE o campo `*_reais` como vem — já está em reais.
  Nunca divida os campos `_centavos`: em campo o modelo errou a casa decimal e
  diria ao cotista um valor dez vezes menor.
entities: [titulo]
modules: [financeiro]
params:
  contrato_id:
    type: string
    source: session
    description: Contrato vinculado à sessão (nunca vem do modelo).
sql: >-
  SELECT id, origem, parcela, valor_centavos, vencimento, meio_pagamento,
         linha_digitavel, pix_copia_cola,
         (valor_centavos / 100)::text || ',' || lpad((valor_centavos % 100)::text, 2, '0') AS valor_reais
  FROM v_titulo
  WHERE contrato_id = :contrato_id AND status = 'aberto'
  ORDER BY vencimento ASC
  LIMIT 1
limits:
  timeout_ms: 2000
  max_rows: 1
output:
  columns:
    - id
    - origem
    - parcela
    - valor_centavos
    - valor_reais
    - vencimento
    - meio_pagamento
    - linha_digitavel
    - pix_copia_cola
  masking: {}
tool:
  expose: true
  name: proxima_parcela
