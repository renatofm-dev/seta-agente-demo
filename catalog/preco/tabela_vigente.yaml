id: preco.tabela_vigente
version: 1
description: >-
  Preço de venda VIGENTE por produto, buscando pelo nome (busca parcial, sem
  diferenciar maiúsculas): produto, preço em centavos e desde quando vale.
  ÚNICA fonte de preço permitida — nunca informe, estime ou negocie preço por
  outra via. Pedido de desconto não se responde com esta tool: escale para um
  atendente humano.
entities: [tabela_preco, produto]
modules: [pedidos]
params:
  termo:
    type: string
    source: agent
    description: 'Parte do nome do produto (ex.: "long neck", "energético").'
sql: >-
  SELECT produto_id, produto, preco_centavos, vigente_desde
  FROM v_tabela_preco
  WHERE produto ILIKE concat('%', CAST(:termo AS text), '%')
  ORDER BY produto
limits:
  timeout_ms: 3000
  max_rows: 20
output:
  columns: [produto_id, produto, preco_centavos, vigente_desde]
  masking: {}
tool:
  expose: true
  name: preco_tabela_vigente
price_source: true
