# Produção HOMELAB (011) — CX23, Caddy do host faz TLS/proxy.
# A DEMO não vai por aqui: ela roda na VPS da SETA com Coolify + Traefik, e o
# compose de lá é o infra/compose.coolify.yml (ver docs/deploy-vps-coolify.md).
# Uso: docker compose -f infra/compose.prod.yml --env-file .env.prod ...
# Imagens vêm do GHCR (CI builda; a VPS só faz pull) — ver docs/deploy-homelab.md.

name: seta-agente

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env.prod}
      # P-29: senhas dos papéis do produto (o init as usa no 1º boot do volume;
      # em volume já existente, rotacionar com ALTER USER — ver docs/deploy-homelab.md)
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?defina no .env.prod}
      ERP_RO_PASSWORD: ${ERP_RO_PASSWORD:?defina no .env.prod}
    volumes:
      - seta_pg_prod:/var/lib/postgresql/data
      # cria bancos app + erp_mock, usuários e extensão pgvector no 1º boot
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    # sem ports: o banco só existe na rede interna do compose

  server:
    image: ghcr.io/renatofm-dev/seta-agente-demo-server:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # `service_started`, não `service_healthy`: o writer do server é preguiçoso
      # (só fala com o TSE quando há baixa) e o papel `tse_sim` do banco nasce no
      # seed, que roda DENTRO deste container — exigir saúde aqui seria impasse
      tse-sim:
        condition: service_started
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      PORT: '3001'
      # P-29: nenhuma senha literal aqui — vêm do .env.prod (o server recusa senha de dev em produção)
      DATABASE_URL: postgres://app_owner:${APP_OWNER_PASSWORD}@db:5432/app
      ERP_DATABASE_URL: postgres://erp_ro:${ERP_RO_PASSWORD}@db:5432/erp_mock
      ERP_MOCK_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/erp_mock
      # 035: o demo-seed.sh cria o papel do simulador com esta senha (o
      # 04-sim-role.sql a lê por bind) — a mesma que o tse-sim usa para conectar
      TSE_SIM_DB_PASSWORD: ${TSE_SIM_DB_PASSWORD:?defina no .env.prod}
      # paths absolutos dentro da imagem
      CLIENT_CONFIG_PATH: /app/configs/demo/client.yaml
      CONTATOS_PATH: /app/configs/demo/contatos.yaml
      CATALOG_DIR: /app/catalog
      SKILLS_SEED_DIR: /app/skills-seed
      KB_DIR: /app/kb
      # 036: o server escreve no ERP pela API do simulador da 035, que vive só
      # na rede interna do compose. Na 041 esta linha passa a apontar para o TSE
      # de verdade, e é a única coisa que muda.
      TSE_BASE_URL: http://tse-sim:3010
      TSE_USERNAME: ${TSE_USERNAME:?defina no .env.prod}
      TSE_PASSWORD: ${TSE_PASSWORD:?defina no .env.prod}
      ERP_CONCILIACAO: ${ERP_CONCILIACAO:-auto}
      RESERVA_TETO_TAXA_SEM_HITL_CENTAVOS: ${RESERVA_TETO_TAXA_SEM_HITL_CENTAVOS:-100000}
      # 015/045: alçada do SDR e os números da venda (todos com default no env.ts)
      SDR_DESCONTO_MAX_BPS: ${SDR_DESCONTO_MAX_BPS:-300}
      VENDA_SINAL_CENTAVOS: ${VENDA_SINAL_CENTAVOS:-200000}
      VENDA_ID_PRODUTO: ${VENDA_ID_PRODUTO:-111}
      VENDA_MEIO_PAGAMENTO_SINAL: ${VENDA_MEIO_PAGAMENTO_SINAL:-2}
      VENDA_MEIO_PAGAMENTO_SALDO: ${VENDA_MEIO_PAGAMENTO_SALDO:-1}
      # 046: a URL pública do SERVER — é ela que vai no link de assinatura. O
      # default do env.ts é `localhost`, que sobe sem erro e gera link morto.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?a URL pública do server, ex https://api.seu-dominio}
      ASSINATURA_PROVIDER: ${ASSINATURA_PROVIDER:-simulado}
      ASSINATURA_AUTENTIQUE_TOKEN: ${ASSINATURA_AUTENTIQUE_TOKEN:-}
    ports:
      - '127.0.0.1:3001:3001' # só o Caddy do host enxerga
    logging: *logging

  # 035: dublê da API do TS Explorer. Sem `ports:` de propósito — igual ao db,
  # só na rede interna; o server o alcança em http://tse-sim:3010 e a internet
  # não o alcança de jeito nenhum (o Caddy não tem rota para ele).
  tse-sim:
    image: ghcr.io/renatofm-dev/seta-agente-demo-tse-sim:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      TSE_SIM_PORT: '3010'
      TSE_SIM_DATABASE_URL: postgres://tse_sim:${TSE_SIM_DB_PASSWORD:?defina no .env.prod}@db:5432/erp_mock
      # `login:senha:idPessoa` — o boot recusa a credencial de exemplo
      TSE_SIM_USERS: ${TSE_SIM_USERS:?defina no .env.prod}
      TSE_SIM_PAINEL_ESCOPO: ${TSE_SIM_PAINEL_ESCOPO:-qualquer}
    # a imagem é node:24-slim, sem curl — o healthcheck usa o próprio node
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:3010/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging

  console:
    image: ghcr.io/renatofm-dev/seta-agente-demo-console:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      SERVER_INTERNAL_URL: http://server:3001
    ports:
      - '127.0.0.1:3000:3000'
    logging: *logging

volumes:
  seta_pg_prod:
